openapi: 3.1.0
info:
  title: Amrutam Telemedicine Backend API
  version: 1.0.0
  description: Production-grade REST API for Amrutam Telemedicine Platform supporting multi-role authentication, rotating refresh sessions, and RFC 6238 TOTP multi-factor authentication.
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server
paths:
  /health/live:
    get:
      summary: Liveness Probe
      description: Returns HTTP 200 when the process event loop is responsive. Does not query database or cache.
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptimeSeconds:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
  /health/ready:
    get:
      summary: Readiness Probe
      description: Checks PostgreSQL and Redis connectivity with bounded timeouts.
      responses:
        '200':
          description: All critical dependencies are healthy
        '503':
          description: One or more critical dependencies are unreachable
  /auth/register:
    post:
      summary: Register a new patient
      description: Public self-registration for patients only. Doctors and Administrators cannot be registered publicly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, password, fullName]
              properties:
                email:
                  type: string
                  format: email
                  example: patient@example.com
                phone:
                  type: string
                  example: "+919876543210"
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: "SuperSecurePassword123!"
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "Aarav Sharma"
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER]
                dateOfBirth:
                  type: string
                  format: date
                  example: "1990-05-15"
      responses:
        '201':
          description: Patient account created successfully
        '400':
          description: Validation error
        '409':
          description: Email or phone already registered
        '429':
          description: Too many registration attempts
  /auth/login:
    post:
      summary: User Login
      description: Authenticates user credentials. Returns JWT access and refresh tokens, or a temporary MFA challenge token if MFA is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful (or MFA challenge required)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      mfaRequired:
                        type: boolean
                      tempToken:
                        type: string
                      user:
                        type: object
                      tokens:
                        type: object
        '401':
          description: Invalid email or password (anti-enumeration)
        '429':
          description: Rate limit exceeded
  /auth/mfa/challenge:
    post:
      summary: Complete Login via MFA Code or Backup Recovery Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tempToken, code]
              properties:
                tempToken:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP code or single-use 8-character recovery code
                  example: "123456"
      responses:
        '200':
          description: MFA challenge completed; access tokens issued
        '401':
          description: Invalid or expired temporary token or verification code
  /auth/refresh:
    post:
      summary: Refresh Access Token with Token Family Rotation
      description: Exchanges an active refresh token for a new access token and rotated refresh token. Detects token reuse and revokes token families if reuse is detected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair issued
        '401':
          description: Invalid, expired, or reused refresh token
  /auth/logout:
    post:
      summary: Revoke Current Refresh Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Session revoked successfully
  /auth/logout-all:
    post:
      summary: Revoke All Active Sessions for User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All user sessions revoked
        '401':
          description: Unauthorized
  /auth/mfa/enroll:
    post:
      summary: Initiate TOTP MFA Enrollment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: Current password re-verification
      responses:
        '200':
          description: Enrollment payload with secret, QR code, and 8 single-use recovery codes
        '401':
          description: Unauthorized or password verification failed
  /auth/mfa/verify-enrollment:
    post:
      summary: Verify Enrollment & Officially Activate MFA
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totpCode]
              properties:
                totpCode:
                  type: string
                  example: "654321"
      responses:
        '200':
          description: MFA successfully activated
        '400':
          description: Invalid 6-digit verification code
  /auth/mfa/disable:
    post:
      summary: Disable MFA
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: MFA disabled
        '401':
          description: Invalid password or code
  /auth/me:
    get:
      summary: Get Current Authenticated User Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile details without sensitive hashes or secrets
        '401':
          description: Unauthorized
  /doctors:
    get:
      summary: Public Doctor Directory Search
      description: Search approved (VERIFIED) doctors with filtering, stable sorting, and bounded pagination.
      parameters:
        - name: specialization
          in: query
          schema:
            type: string
          description: Filter by clinical specialization (e.g. Ayurveda, Panchakarma)
        - name: mode
          in: query
          schema:
            type: string
            enum: [VIDEO, AUDIO, CHAT]
          description: Filter by supported consultation mode
        - name: language
          in: query
          schema:
            type: string
          description: Filter by language spoken (e.g. English, Hindi)
        - name: minFee
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxFee
          in: query
          schema:
            type: number
            minimum: 0
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [experienceYears, consultationFee, createdAt, fullName]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Paginated array of approved doctors
  /doctors/profile:
    post:
      summary: Submit Doctor Profile for Verification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, licenseNumber, specializations, qualifications, experienceYears, consultationFee, supportedModes]
              properties:
                fullName:
                  type: string
                licenseNumber:
                  type: string
                specializations:
                  type: array
                  items:
                    type: string
                qualifications:
                  type: array
                  items:
                    type: string
                experienceYears:
                  type: integer
                  minimum: 0
                consultationFee:
                  type: number
                  minimum: 0
                supportedModes:
                  type: array
                  items:
                    type: string
                    enum: [VIDEO, AUDIO, CHAT]
                languages:
                  type: array
                  items:
                    type: string
                bio:
                  type: string
      responses:
        '201':
          description: Doctor profile submitted in PENDING status
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '409':
          description: Duplicate profile or license number
  /doctors/profile/me:
    get:
      summary: Get Authenticated Doctor's Own Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Doctor profile details
        '401':
          description: Unauthorized
        '404':
          description: Profile not found
    patch:
      summary: Update Permitted Doctor Profile Fields
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                specializations:
                  type: array
                  items:
                    type: string
                qualifications:
                  type: array
                  items:
                    type: string
                experienceYears:
                  type: integer
                consultationFee:
                  type: number
                supportedModes:
                  type: array
                  items:
                    type: string
                    enum: [VIDEO, AUDIO, CHAT]
                languages:
                  type: array
                  items:
                    type: string
                bio:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
        '401':
          description: Unauthorized
        '404':
          description: Profile not found
  /doctors/{id}:
    get:
      summary: Public Doctor Profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved doctor public profile details
        '404':
          description: Doctor not found or not verified
  /admin/doctors/pending:
    get:
      summary: List Doctor Profiles Awaiting Verification
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending doctor applications
        '403':
          description: Forbidden (Admin role required)
  /admin/doctors/{id}/approve:
    post:
      summary: Approve Doctor Profile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Doctor approved and role upgraded to DOCTOR
        '403':
          description: Forbidden or self-approval attempt
        '404':
          description: Profile not found
  /admin/doctors/{id}/reject:
    post:
      summary: Reject Doctor Profile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
      responses:
        '200':
          description: Doctor profile rejected with documented reason
        '400':
          description: Missing or invalid reason
        '403':
          description: Forbidden or self-rejection attempt
        '404':
          description: Profile not found
  /availability/slots:
    post:
      summary: Create Doctor Availability Slots
      security:
        - BearerAuth: []
      description: Creates one or more availability slots. Rejects past slots, durations < 10m or > 4h, and overlapping slots (enforced by PostgreSQL GIST exclusion constraint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                slots:
                  type: array
                  items:
                    type: object
                    required: [startTime, endTime]
                    properties:
                      startTime:
                        type: string
                        format: date-time
                      endTime:
                        type: string
                        format: date-time
      responses:
        '201':
          description: Availability slots successfully created
        '400':
          description: Validation error or invalid duration/overlap
        '403':
          description: Forbidden (Doctor role and verified status required)
        '409':
          description: Slot overlaps with an existing slot in doctor's schedule
  /availability/my-slots:
    get:
      summary: List Doctor's Own Availability Slots
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, RESERVED, BOOKED, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of doctor's own slots
        '403':
          description: Forbidden
  /availability/slots/{id}:
    patch:
      summary: Update an Eligible Availability Slot
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum: [AVAILABLE, CANCELLED]
      responses:
        '200':
          description: Slot updated successfully
        '400':
          description: Invalid time or cancelled slot
        '403':
          description: Forbidden or ownership mismatch
        '409':
          description: Conflict (slot already booked or overlaps)
    delete:
      summary: Cancel an Unbooked Availability Slot
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Slot successfully cancelled
        '403':
          description: Forbidden or ownership mismatch
        '409':
          description: Cannot cancel a slot with an active consultation
  /availability/doctors/{doctorId}:
    get:
      summary: Public Query of an Approved Doctor's Available Slots
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of available future slots
        '404':
          description: Doctor not found or not verified
  /bookings:
    post:
      summary: Book an Appointment Slot
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId]
              properties:
                slotId:
                  type: string
                  format: uuid
                mode:
                  type: string
                  enum: [VIDEO, AUDIO, CHAT]
                  default: VIDEO
      responses:
        '201':
          description: Booking created successfully (or cached replay of prior identical idempotent request)
        '400':
          description: Validation error, self-booking, or idempotency key reused with different request payload
        '409':
          description: Slot already booked, unavailable, or concurrent request with this idempotency key currently processing
    get:
      summary: List Bookings
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [BOOKED, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of bookings
  /bookings/{id}:
    get:
      summary: Get Booking Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking details
        '404':
          description: Not found
  /bookings/{id}/cancel:
    post:
      summary: Cancel a Booking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancellationReason]
              properties:
                cancellationReason:
                  type: string
      responses:
        '200':
          description: Booking cancelled successfully
        '400':
          description: Invalid transition
  /consultations/{id}:
    get:
      summary: Get Consultation Clinical & Administrative Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Consultation details
  /consultations/{id}/consent:
    post:
      summary: Record Explicit Patient Telemedicine Consent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              properties:
                granted:
                  type: boolean
                  enum: [true]
                consentType:
                  type: string
                  enum: [TELEMEDICINE_CONSULTATION, DATA_PROCESSING, PRESCRIPTION_DELIVERY]
                  default: TELEMEDICINE_CONSULTATION
                version:
                  type: string
                  default: TPG_2020_V1
      responses:
        '200':
          description: Consent recorded
  /consultations/{id}/start:
    post:
      summary: Start Teleconsultation Session
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Consultation started
        '400':
          description: Consent not recorded or invalid state
  /consultations/{id}/complete:
    post:
      summary: Complete Consultation with Clinical Notes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinicalNotes]
              properties:
                clinicalNotes:
                  type: string
      responses:
        '200':
          description: Consultation completed
  /consultations/{id}/no-show:
    post:
      summary: Mark Consultation as No-Show
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as no-show
  /consultations/{id}/prescriptions:
    post:
      summary: Issue Versioned Digital Prescription
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diagnosis, items]
              properties:
                diagnosis:
                  type: string
                advice:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [medicineName, dosage, frequency, durationDays]
                    properties:
                      medicineName:
                        type: string
                      dosage:
                        type: string
                      frequency:
                        type: string
                      durationDays:
                        type: integer
                      instructions:
                        type: string
                parentPrescriptionId:
                  type: string
                  format: uuid
                amendmentReason:
                  type: string
      responses:
        '201':
          description: Prescription issued successfully
    get:
      summary: Get Prescriptions for Consultation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of prescription revisions
  /prescriptions/{id}:
    get:
      summary: Get Prescription Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prescription details with items
  /payments/create-order:
    post:
      summary: Create Trusted Server-Priced Payment Order
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultationId]
              properties:
                consultationId:
                  type: string
                  format: uuid
                provider:
                  type: string
                  enum: [MOCK, RAZORPAY, STRIPE]
      responses:
        '201':
          description: Payment order created successfully (or cached replay of prior identical idempotent request)
        '400':
          description: Consultation already completed, or idempotency key reused with different request payload
        '409':
          description: Concurrent request with this idempotency key currently processing
  /payments/webhook:
    post:
      summary: Payment Gateway Webhook Receiver
      description: Cryptographically authenticated and deduplicated webhook processing.
      parameters:
        - name: x-razorpay-signature
          in: header
          schema:
            type: string
        - name: x-payment-provider
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook received and processed
        '401':
          description: Invalid signature
  /payments/mock-capture:
    post:
      summary: Simulated Payment Capture
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                paymentId:
                  type: string
      responses:
        '200':
          description: Payment captured
  /payments/consultation/{consultationId}:
    get:
      summary: Get Payment Status for Consultation
      security:
        - BearerAuth: []
      parameters:
        - name: consultationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment details
  /admin/analytics/overview:
    get:
      summary: Platform Operational Analytics Overview
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Aggregated analytics
  /admin/audit-logs:
    get:
      summary: System Audit Logs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: actorId
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated audit logs
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
