openapi: 3.1.0
info:
  title: Amrutam Telemedicine Backend API
  version: 1.0.0
  description: Production-grade REST API for Amrutam Telemedicine Platform supporting multi-role authentication, rotating refresh sessions, and RFC 6238 TOTP multi-factor authentication.
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server
paths:
  /health/live:
    get:
      summary: Liveness Probe
      description: Returns HTTP 200 when the process event loop is responsive. Does not query database or cache.
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptimeSeconds:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
  /health/ready:
    get:
      summary: Readiness Probe
      description: Checks PostgreSQL and Redis connectivity with bounded timeouts.
      responses:
        '200':
          description: All critical dependencies are healthy
        '503':
          description: One or more critical dependencies are unreachable
  /auth/register:
    post:
      summary: Register a new patient
      description: Public self-registration for patients only. Doctors and Administrators cannot be registered publicly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, password, fullName]
              properties:
                email:
                  type: string
                  format: email
                  example: patient@example.com
                phone:
                  type: string
                  example: "+919876543210"
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: "SuperSecurePassword123!"
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "Aarav Sharma"
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER]
                dateOfBirth:
                  type: string
                  format: date
                  example: "1990-05-15"
      responses:
        '201':
          description: Patient account created successfully
        '400':
          description: Validation error
        '409':
          description: Email or phone already registered
        '429':
          description: Too many registration attempts
  /auth/login:
    post:
      summary: User Login
      description: Authenticates user credentials. Returns JWT access and refresh tokens, or a temporary MFA challenge token if MFA is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful (or MFA challenge required)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      mfaRequired:
                        type: boolean
                      tempToken:
                        type: string
                      user:
                        type: object
                      tokens:
                        type: object
        '401':
          description: Invalid email or password (anti-enumeration)
        '429':
          description: Rate limit exceeded
  /auth/mfa/challenge:
    post:
      summary: Complete Login via MFA Code or Backup Recovery Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tempToken, code]
              properties:
                tempToken:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP code or single-use 8-character recovery code
                  example: "123456"
      responses:
        '200':
          description: MFA challenge completed; access tokens issued
        '401':
          description: Invalid or expired temporary token or verification code
  /auth/refresh:
    post:
      summary: Refresh Access Token with Token Family Rotation
      description: Exchanges an active refresh token for a new access token and rotated refresh token. Detects token reuse and revokes token families if reuse is detected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair issued
        '401':
          description: Invalid, expired, or reused refresh token
  /auth/logout:
    post:
      summary: Revoke Current Refresh Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Session revoked successfully
  /auth/logout-all:
    post:
      summary: Revoke All Active Sessions for User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All user sessions revoked
        '401':
          description: Unauthorized
  /auth/mfa/enroll:
    post:
      summary: Initiate TOTP MFA Enrollment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: Current password re-verification
      responses:
        '200':
          description: Enrollment payload with secret, QR code, and 8 single-use recovery codes
        '401':
          description: Unauthorized or password verification failed
  /auth/mfa/verify-enrollment:
    post:
      summary: Verify Enrollment & Officially Activate MFA
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totpCode]
              properties:
                totpCode:
                  type: string
                  example: "654321"
      responses:
        '200':
          description: MFA successfully activated
        '400':
          description: Invalid 6-digit verification code
  /auth/mfa/disable:
    post:
      summary: Disable MFA
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: MFA disabled
        '401':
          description: Invalid password or code
  /auth/me:
    get:
      summary: Get Current Authenticated User Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile details without sensitive hashes or secrets
        '401':
          description: Unauthorized
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
